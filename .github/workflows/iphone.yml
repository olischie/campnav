# Fabrique l'appli iPhone de campnav sur un Mac de GitHub (gratuit pour un dépôt public).
# Résultat : campnav.ipa (non signé) et source.json, publiés dans la release « iphone ».
# SideStore signe l'appli avec votre identifiant Apple au moment de l'installer.
name: Appli iPhone

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon-512.png'
      - 'app-iphone/**'
      - '.github/workflows/iphone.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app-iphone
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
      IPA_URL: https://github.com/${{ github.repository }}/releases/download/iphone/campnav.ipa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Composants
        run: |
          npm install --no-audit --no-fund
          npm ls --depth=0 || true

      - name: Pages de l'appli
        run: |
          rm -rf www && mkdir www
          cp ../index.html ../manifest.webmanifest ../*.png www/
          npx esbuild native.js --bundle --format=iife --minify --target=safari15 --outfile=www/native.js
          # native.js doit être chargé avant le reste de la page
          python3 - <<'EOF'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          assert '<head>' in s
          s = s.replace('<head>', '<head>\n<script src="native.js"></script>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          ls -la www

      - name: Projet iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Réglages iOS (GPS et voix en arrière-plan, portrait)
        run: |
          # plistlib plutôt que PlistBuddy : PlistBuddy coupe les textes à la
          # première apostrophe (« l'écran »), sans signaler d'erreur.
          python3 - <<'EOF'
          import plistlib
          p = 'ios/App/App/Info.plist'
          d = plistlib.load(open(p, 'rb'))
          d.update({
            'CFBundleDisplayName': 'campnav',
            'NSLocationWhenInUseUsageDescription':
              "campnav utilise votre position pour vous guider.",
            'NSLocationAlwaysAndWhenInUseUsageDescription':
              "campnav utilise votre position pour continuer le guidage quand l'écran est verrouillé.",
            'UIBackgroundModes': ['location', 'audio'],
            'UISupportedInterfaceOrientations': ['UIInterfaceOrientationPortrait'],
          })
          plistlib.dump(d, open(p, 'wb'))
          d2 = plistlib.load(open(p, 'rb'))
          for k in ('NSLocationWhenInUseUsageDescription', 'NSLocationAlwaysAndWhenInUseUsageDescription', 'UIBackgroundModes'):
            assert d2.get(k), k
            print(k, '=', d2[k])
          EOF
          plutil -lint ios/App/App/Info.plist

      - name: Icône
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls "$ICON"
          # Icône 1024 px sans transparence (exigence d'iOS)
          sips -s format jpeg ../icon-512.png --out /tmp/icon.jpg >/dev/null
          sips -s format png -z 1024 1024 /tmp/icon.jpg --out "$ICON/AppIcon-512@2x.png"

      - name: Compilation (sans signature)
        run: |
          set -o pipefail
          if [ -d ios/App/App.xcworkspace ]; then SRC="-workspace ios/App/App.xcworkspace"; else SRC="-project ios/App/App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Paquet .ipa et source SideStore
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          test -f "$APP/public/native.js"
          python3 -c "import plistlib; d=plistlib.load(open('$APP/Info.plist','rb')); [d[k] for k in ('NSLocationAlwaysAndWhenInUseUsageDescription','UIBackgroundModes')]; print('Info.plist OK')"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          rm -f campnav.ipa && zip -qry campnav.ipa Payload
          ls -la campnav.ipa
          python3 - <<'EOF'
          import json, os, datetime
          size = os.path.getsize('campnav.ipa')
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          ver, build, url = os.environ['VERSION'], os.environ['BUILD'], os.environ['IPA_URL']
          desc = ("Navigation GPS pour camping-car : itinéraire adapté au gabarit, alertes de hauteur, "
                  "aires et services, trafic, guidage vocal. Le guidage continue écran verrouillé.")
          src = {
            "name": "campnav",
            "identifier": "be.olischie.campnav.source",
            "subtitle": "GPS camping-car",
            "description": desc,
            "iconURL": "https://olischie.github.io/campnav/icon-512.png",
            "apps": [{
              "name": "campnav",
              "bundleIdentifier": "be.olischie.campnav",
              "developerName": "olischie",
              "subtitle": "GPS camping-car",
              "localizedDescription": desc,
              "iconURL": "https://olischie.github.io/campnav/icon-512.png",
              "version": ver, "versionDate": now, "downloadURL": url, "size": size,
              "versions": [{ "version": ver, "buildVersion": build, "date": now,
                             "downloadURL": url, "size": size, "minOSVersion": "14.0" }]
            }],
            "news": []
          }
          json.dump(src, open('source.json', 'w'), ensure_ascii=False, indent=2)
          EOF
          cat source.json

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Version $VERSION — $(date -u '+%d/%m/%Y %H:%M') UTC. Installation : voir le README, section « Appli iPhone »."
          if ! gh release view iphone >/dev/null 2>&1; then
            gh release create iphone --title "Appli iPhone" --notes "$NOTES" --prerelease
          else
            gh release edit iphone --notes "$NOTES"
          fi
          gh release upload iphone campnav.ipa source.json --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campnav-ios
          path: |
            app-iphone/campnav.ipa
            app-iphone/source.json
          if-no-files-found: ignore
